name: Publish to PyPI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Check if version is already on PyPI
        id: check
        run: |
          VERSION=$(python3 -c "import re; from pathlib import Path; print(re.search(r'^version = \"([^\"]+)\"', Path('pyproject.toml').read_text(), re.M).group(1))")
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/conduto/${VERSION}/json")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "$CODE" = "200" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Versao ${VERSION} ja publicada? HTTP ${CODE}"

      - name: Build package
        if: steps.check.outputs.already_published != 'true'
        run: uv build

      - name: Publish to PyPI
        if: steps.check.outputs.already_published != 'true'
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.check.outputs.already_published }}" = "true" ]; then
            echo "Versao ${{ steps.check.outputs.version }} ja existe no PyPI; publish pulado." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Versao ${{ steps.check.outputs.version }} publicada no PyPI." >> "$GITHUB_STEP_SUMMARY"
          fi
