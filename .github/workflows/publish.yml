name: Publish to PyPI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Tipo de bump (merge na main usa patch)"
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  id-token: write
  contents: write

# Serializa os runs de publicacao (varios merges rapidos nao concorrem).
concurrency:
  group: publish-conduto
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Decide version (bump automatico no merge)
        id: decide
        run: |
          PART="patch"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PART="${{ github.event.inputs.bump }}"
          fi
          python3 .github/scripts/next_release.py "$PART" | tee "$RUNNER_TEMP/release.txt"
          grep -E '^version=' "$RUNNER_TEMP/release.txt" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}

      - name: Tag release
        run: |
          git tag "v${{ steps.decide.outputs.version }}"
          git push origin "v${{ steps.decide.outputs.version }}"

      - name: Summary
        run: |
          echo "Versao ${{ steps.decide.outputs.version }} publicada no PyPI." >> "$GITHUB_STEP_SUMMARY"