[project]
name = "conduto"
version = "0.1.7"
description = "CLI to scaffold data migration/ELT projects with YAML schemas and a uv-managed environment."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "João Pedro Zanetti Gonçalves" }]
keywords = ["etl", "elt", "dagster", "database", "migration", "schemas", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "boto3>=1.34",
    "clickhouse-connect>=1.7",
    "deltalake>=0.20",
    "duckdb>=1.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.2",
    "pyodbc>=5.1",
    "pymysql>=1.1",
    "pyyaml>=6.0",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "typer>=0.27.1",
    "pyarrow>=15.0",
]

[project.scripts]
conduto = "conduto.cli:app"

[project.urls]
Homepage = "https://github.com/joaopedrozg/conduto"
Repository = "https://github.com/joaopedrozg/conduto"
Issues = "https://github.com/joaopedrozg/conduto/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conduto = ["templates/**/*.jinja"]

[tool.uv.workspace]
members = [
    "teste/meuteste",
    "teste/meu_teste",
    "teste/meu_etl",
]

