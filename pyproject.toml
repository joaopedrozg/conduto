[project]
name = "conduto"
version = "0.1.28"
description = "CLI to scaffold data migration/ELT projects with YAML schemas and a uv-managed environment."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "João Pedro Zanetti Gonçalves" }]
keywords = ["etl", "elt", "dagster", "database", "migration", "schemas", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "jinja2>=3.1.6",
    "pyyaml>=6.0",
    "rich>=15.0.0",
    "textual>=8.2.0",
    "typer>=0.27.1",
]

# Drivers de banco por SGBD. Cada extra instala so o que o SGBD pede;
# "all" traz todos. Ex.: pip install "conduto[postgresql]" ou conduto[all].
[project.optional-dependencies]
postgresql = ["psycopg[binary]>=3.2"]
mysql = ["pymysql>=1.1"]
sqlserver = ["pyodbc>=5.1"]
clickhouse = ["clickhouse-connect>=1.7"]
duckdb = ["duckdb>=1.0"]
deltalake = [
    "deltalake>=0.20",
    "pyarrow>=15.0",
    "boto3>=1.34",
]
all = [
    "psycopg[binary]>=3.2",
    "pymysql>=1.1",
    "pyodbc>=5.1",
    "clickhouse-connect>=1.7",
    "duckdb>=1.0",
    "deltalake>=0.20",
    "pyarrow>=15.0",
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
conduto = "conduto.cli:app"

[project.urls]
Homepage = "https://github.com/joaopedrozg/conduto"
Repository = "https://github.com/joaopedrozg/conduto"
Issues = "https://github.com/joaopedrozg/conduto/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conduto = ["templates/**/*.jinja"]
